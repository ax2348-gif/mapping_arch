# @package _global_
# The z2 task contract and its episodes; the model selects it.
defaults:
  - /generator: bank

task:
  _target_: mapping.config.Task
  name: z2
  episode_steps: 32     # walk steps T (T + 1 observations)
  queries: 8
  query_times: last      # last: every query at step T; uniform: at a step drawn from 0..T
