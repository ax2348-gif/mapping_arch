# One training run (mapping.config.Experiment). Pick a model, which picks
# its task and that task's generator; every other group has a default.
#   python run.py model=se2d/hybrid4 model.size=s
#   python run.py model=z2/vanilla model.size=m schedule=wsd
#   python run.py +experiment=se2c_bridge model.size=m
#   python run.py --exp my_experiment.yaml run.seed=1
# docs/config.md has the field map and the experiment workflow.
defaults:
  - model: ???          # <task>/<name>: conf/model/<task>/<name>.yaml
  - schedule: cosine
  - _self_

_target_: mapping.config.Experiment

# Every model file (conf/model/<task>/<name>.yaml) sets model.name,
# model.ladder, model.size (a rung of that ladder) and model.arch; the
# rung's arguments come from conf/ladders/<ladder>.yaml.
model:
  _target_: mapping.config.Model
  size_kwargs: ${ladder:${model.ladder},${model.size}}
  # how query tokens mix (mapping/models/query_mode.py): mixed (ordinary tokens,
  # every model before the option) | inert (read-only: no GDN write, no short
  # conv, attend to history and their own tokens only); inert is refused by a
  # model that does not implement it
  query_mode: mixed
  # Gated DeltaNet scan arithmetic (mapping/models/scan_precision.py): tf32 (fla's
  # chunk-64 kernel as given, TF32 dots: every run before the option) | ieee
  # (fp32 inputs, chunk 32, IEEE dots: exact to fp32); ieee is refused by a model
  # without a Gated DeltaNet
  scan_precision: tf32

optim:
  _target_: mapping.config.AdamW
  lr: ${model_lr:${task.name},${model.name},${model.size}}   # the model's default
  weight_decay: 0.1
  clip: 1.0
  batch: 64

run:
  _target_: mapping.config.Run
  name: null            # run directory name; null: seed<seed>
  out: null             # explicit run directory; wins over dir when set
  root: results         # where run directories live (docs/config.md, "Run directories")
  # the run directory, the same template for every task; a preset may restructure it
  dir: ${run.root}/${task.name}/${model.name}/${model.size}/${run_name:${run.name},${run.seed}}
  # REQUIRED at launch and never set in conf/ or a preset: what this run is for, like a
  # commit message (run.note='...', xp run -m '...'); recorded in the ledger
  note: null
  tag: []               # campaign labels (a preset may set them), recorded in the ledger
  provenance:           # the code snapshot every run makes (mapping/provenance.py)
    _target_: mapping.config.Provenance
    max_untracked_mb: 20  # refuse to snapshot an untracked file larger than this
  steps: 2000
  seed: 0
  save_every: 0         # write step<k>.pt (with optimizer) every k steps
  branch: null          # a step<k>.pt to continue from, into a new run
  # weights-only warm start (docs/config.md, "run.init_from"): a NEW run (fresh
  # optimizer, schedule and step 0) starting from this checkpoint's model weights;
  # the architecture must match exactly, task settings may differ. Not with branch.
  init_from: null
  init_sha256: null     # null: filled at launch with the checkpoint's sha256; set: verified
  init_run_id: null     # null: filled at launch with the checkpoint's run id; set: verified
  device: null          # null: cuda if available, else cpu
  bf16: true
  compile: false
  overwrite: false      # true: write into a non-empty run directory (else refused)

eval:
  _target_: mapping.config.Eval
  batches: 16
  every: 250
  log_every: 50
