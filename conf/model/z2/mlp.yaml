# Sizes: conf/model/size/mlp/ (model/size=mlp/<size>).
defaults:
  - /task: z2
  - /model/size: mlp/xs

model:
  _target_: mapping.config.Model
  name: mlp
  arch:
    _target_: mapping.models.mlp.FlatMLP
    _partial_: true
