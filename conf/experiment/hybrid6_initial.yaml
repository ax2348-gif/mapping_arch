# @package _global_
# Approved initial setting. First 100k steps match the SAW hybrid4 parent LR.
defaults:
  - override /model: se2d/hybrid6_causal
  - override /schedule: wsd

model:
  size: s
  query_mode: inert
  scan_precision: tf32
task:
  episode_steps: 32
  queries: 8
  query_times: uniform
  generator:
    texture: mnist
    step_px: 9
    odometry_dropout: 0.0
    path: saw
    workers: 6
schedule:
  warmup: 100
  cooldown: 0.0
optim:
  lr: 0.0003
  batch: 64
  weight_decay: 0.1
  clip: 1.0
run:
  name: hybrid6_initial_saw_s_seed0
  steps: 100000
  seed: 0
  save_every: 10000
  device: cuda
  bf16: true
  compile: false
eval:
  batches: 16
  every: 10000
  log_every: 2000
